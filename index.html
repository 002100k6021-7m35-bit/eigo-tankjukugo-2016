<head>

<title>英語単熟語2016</title>
<meta name="description" content="英語単熟語2016の単語・熟語学習アプリ。1680語・例文付き。進捗管理・マイ単語・テスト機能あり。"/>

<body>
<div id="root"></div>
<div id="loading" style="font-family:sans-serif;padding:2rem;text-align:center;color:#666">読み込み中…</div>
<script>
(async function(){
  try {
    let css = '';
    for (let i=0;i<6;i++) css += await (await fetch('./assets/c'+i+'.css')).text();
    const st = document.createElement('style');
    st.textContent = css;
    document.head.appendChild(st);
    let code = '';
    for (let i=0;i<35;i++) code += await (await fetch('./assets/j'+i+'.js')).text();
    document.getElementById('loading').remove();
    const s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  } catch(e) {
    document.getElementById('loading').textContent = '読み込みエラー: '+e.message;
  }
})();
</script>
</body>
</html>
